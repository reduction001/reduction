<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080808">
<meta name="description" content="Reduction. Less noise. More consequence. Explore our briefings.">
<title>reduction</title>
<style>
:root{color-scheme:dark;--bg:#080808;--fg:#f5f3ed;--muted:#9a9a94;--orange:#e94d24}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:Arial,Helvetica,sans-serif}body{min-height:100svh}a{color:inherit}main{min-height:100svh;display:grid;place-items:center;padding:30px}h1{font-size:clamp(68px,11vw,170px);font-weight:600;letter-spacing:-.075em;line-height:1;margin:0;text-align:center}h1::after{content:"";display:inline-block;width:.065em;height:.065em;background:var(--orange);margin-left:.1em;vertical-align:baseline}.pane{position:fixed;inset:0 auto 0 0;width:220px;padding:38px 26px;background:#0d0d0d;border-right:1px solid #202020;display:flex;flex-direction:column;z-index:10}.pane-label{font:11px monospace;letter-spacing:2px;color:var(--muted);margin:0 0 52px}.navigation{list-style:none;padding:0;margin:0}.navigation li{border-top:1px solid #2a2a2a}.navigation a{display:block;text-decoration:none;padding:20px 0}.nav-title{display:flex;align-items:center;justify-content:space-between;font-size:20px;letter-spacing:-.5px}.nav-title span:last-child{color:var(--orange)}.nav-note{display:block;color:var(--muted);font-size:11px;line-height:1.6;margin-top:8px;max-width:155px}.navigation a:hover .nav-title{color:var(--orange)}.future{padding:22px 0;border-top:1px solid #2a2a2a;margin:0;color:var(--muted);font-size:12px;line-height:1.7}.future span{display:block;font:11px monospace;color:#767671;letter-spacing:1px;margin-bottom:8px}.pane-footer{margin-top:auto;padding-top:35px;color:#777;font:10px monospace;letter-spacing:1px;line-height:1.8}.menu-toggle,.close{display:none}.signature{position:fixed;right:30px;bottom:28px;font:10px monospace;letter-spacing:1.5px;color:#72726e}.skip{position:fixed;top:-100px;left:240px;padding:12px;background:var(--fg);color:var(--bg);z-index:30}.skip:focus{top:12px}:focus-visible{outline:2px solid var(--orange);outline-offset:6px}@media(max-width:1000px){.pane{transform:translateX(-100%);transition:transform .2s ease;width:260px;box-shadow:15px 0 60px #0008}.pane.open{transform:translateX(0)}.menu-toggle{display:block;position:fixed;left:24px;top:24px;border:1px solid #343434;background:transparent;color:var(--fg);padding:11px 14px;font:11px monospace;letter-spacing:1px;cursor:pointer;z-index:11}.close{display:block;border:0;background:none;color:var(--muted);font:12px monospace;position:absolute;right:20px;top:37px;cursor:pointer}.pane.open~.menu-toggle{visibility:hidden}.signature{left:24px;right:auto;font-size:9px}.skip{left:24px}h1{font-size:clamp(56px,15vw,140px)}}@media(prefers-reduced-motion:reduce){.pane{transition:none}}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<aside class="pane" id="navigation-pane" aria-label="Site navigation">
<p class="pane-label">REDUCTION / INDEX</p>
<button class="close" type="button" aria-label="Close navigation">CLOSE ×</button>
<nav aria-label="Briefings"><ul class="navigation">
<li><a href="/rtx"><span class="nav-title"><span>RTX</span><span aria-hidden="true">↗</span></span><span class="nav-note">Aerospace, defense &amp; B2B creativity</span></a></li>
</ul></nav>
<p class="future"><span>UP NEXT</span>More briefings.<br>Room to grow.</p>
<p class="pane-footer">LESS NOISE.<br>MORE CONSEQUENCE.</p>
</aside>
<button class="menu-toggle" type="button" aria-controls="navigation-pane" aria-expanded="false">MENU +</button>
<main id="main"><h1>reduction</h1></main>
<div class="signature" aria-hidden="true">NEW YORK / INDEPENDENT SIGNAL</div>
<script>
const pane=document.getElementById('navigation-pane');
const toggle=document.querySelector('.menu-toggle');
const close=document.querySelector('.close');
const mobile=window.matchMedia('(max-width:1000px)');
function setMenu(open){pane.classList.toggle('open',open);toggle.setAttribute('aria-expanded',String(open));pane.inert=mobile.matches&&!open;if(open&&mobile.matches)close.focus()}
toggle.addEventListener('click',()=>setMenu(true));
close.addEventListener('click',()=>{setMenu(false);toggle.focus()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&pane.classList.contains('open')){setMenu(false);toggle.focus()}});
mobile.addEventListener('change',()=>setMenu(false));
setMenu(false);
</script>
</body>
</html>
