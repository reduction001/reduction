<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Editorial review / reduction</title><link rel="stylesheet" href="/dashboards/dashboard.css"></head><body><main><p class="label">REVIEW / NEVER AUTO-APPROVED</p><h1>editorial</h1><p>Discovery queue. Review sources before changing claims. Exporting does not publish, save to GitHub, approve queue items, or advance review dates.</p><p>No pending items from the available discovery data.</p><p><a href="https://github.com/reduction001/reduction/edit/feature/brand-dashboards/public/dashboards/data/powerade-editorial.json">Authenticated GitHub content editor ↗</a></p><label for="editorial">Reviewed content JSON</label><textarea id="editorial" style="display:block;width:100%;min-height:450px;background:#10171c;color:white"></textarea><button id="export">Validate &amp; export</button><p id="status" role="status"></p><a href="/dashboards/admin/">Brand management</a></main><script>fetch('/dashboards/data/powerade-editorial.json').then(r=>r.json()).then(d=>document.querySelector('#editorial').value=JSON.stringify(d,null,2));document.querySelector('#export').onclick=()=>{try{const d=JSON.parse(document.querySelector('#editorial').value);if(!/^\d{4}-\d{2}-\d{2}$/.test(d.reviewed_at))throw Error('Review date required');for(const k of ['headline','interpretation','what_changed','why_it_matters','implication','limitations'])if(!d.lens[k])throw Error('Lens field missing: '+k);if(!d.lens.sources.length||d.lens.sources.some(u=>!u.startsWith('https://')))throw Error('HTTPS supporting sources required');if(/AIza[0-9A-Za-z_-]{30,}/.test(JSON.stringify(d)))throw Error('Never include API keys');const u=URL.createObjectURL(new Blob([JSON.stringify(d,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download='powerade-editorial.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);document.querySelector('#status').textContent='Validated and exported. No publication or approval performed.'}catch(e){document.querySelector('#status').textContent=e.message}};</script></body></html>
