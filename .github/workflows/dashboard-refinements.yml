name: Apply dashboard QA corrections
on:
  push:
    branches: [feature/brand-dashboards]
    paths: [pipeline/refine_dashboard.py, .github/workflows/dashboard-refinements.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dashboard-writes-${{ github.ref }}
  cancel-in-progress: false
jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python pipeline/refine_dashboard.py
      - name: Commit refinements and integration
        run: |
          git config user.name 'Reduction monitor'
          git config user.email 'reduction-monitor@users.noreply.github.com'
          git add public/dashboards/ .github/workflows/
          if ! git diff --cached --quiet; then
            git commit -m 'Apply thumbnail media news grouping and source hierarchy'
            git pull --rebase
            git push
          fi
