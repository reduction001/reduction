name: Read-only hosted preview QA
on:
  push:
    branches: [feature/brand-dashboards]
    paths: [qa/hosted_preview.py, .github/workflows/hosted-preview-qa.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python qa/hosted_preview.py
      - name: Upload hosted observations and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hosted-preview-readiness
          path: qa-artifacts/
          retention-days: 7
