name: Unified dashboard refresh and QA
on:
  push:
    branches: [feature/brand-dashboards]
    paths: [pipeline/refresh_dashboard.py, pipeline/test_dashboard_refresh.py, .github/workflows/dashboard-refresh.yml]
  workflow_dispatch:
  schedule:
    - cron: '53 11 * * 1'
permissions:
  contents: write
concurrency:
  group: dashboard-writes-${{ github.ref }}
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python pipeline/refresh_dashboard.py
      - run: python pipeline/test_dashboard_refresh.py
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python pipeline/dashboard_qa.py
      - name: Refuse untested remote changes and commit only validated output
        run: |
          git fetch origin "$GITHUB_REF_NAME"
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/$GITHUB_REF_NAME)" ]; then
            echo 'Branch advanced during QA; rerun against the new head instead of rebasing untested output'
            exit 1
          fi
          if ! git diff --quiet -- .github/workflows/; then
            echo 'Unexpected workflow mutation; refusing commit'
            exit 1
          fi
          git config user.name 'Reduction monitor'
          git config user.email 'reduction-monitor@users.noreply.github.com'
          git add public/dashboards/ pipeline/refine_dashboard.py
          if git diff --cached --name-only | grep -q '^.github/workflows/'; then exit 1; fi
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh validated dashboard data and presentation'
            git push
          fi
      - name: Upload full-refresh QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unified-refresh-preview-and-readiness
          path: qa-artifacts/
          retention-days: 7
