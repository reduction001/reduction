name: Corrected dashboard browser QA
on:
  push:
    branches: [feature/brand-dashboards]
    paths: [pipeline/update_dashboard_qa.py, .github/workflows/dashboard-qa-v2.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dashboard-writes-${{ github.ref }}
  cancel-in-progress: false
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python pipeline/update_dashboard_qa.py
      - name: Commit QA updates
        run: |
          git config user.name 'Reduction monitor'
          git config user.email 'reduction-monitor@users.noreply.github.com'
          git add pipeline/dashboard_qa.py
          if ! git diff --cached --quiet; then
            git commit -m 'Update browser QA for corrected dashboard'
            git pull --rebase
            git push
          fi
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python pipeline/dashboard_qa.py
      - name: Upload corrected preview and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corrected-dashboard-preview-and-readiness
          path: qa-artifacts/
          retention-days: 7
