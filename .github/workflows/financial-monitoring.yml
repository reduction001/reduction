name: Parent financial monitoring
on:
  push:
    branches: [feature/brand-dashboards]
    paths: [pipeline/financial_monitor.py, .github/workflows/financial-monitoring.yml]
  workflow_dispatch:
  schedule:
    - cron: '17 12 2 * *'
permissions:
  contents: write
concurrency:
  group: dashboard-writes-${{ github.ref }}
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python pipeline/financial_monitor.py
      - name: Commit parent financial data
        run: |
          git config user.name 'Reduction monitor'
          git config user.email 'reduction-monitor@users.noreply.github.com'
          git add public/dashboards/data/powerade-parent-financials.json public/dashboards/powerade/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh SEC parent revenue data'
            git pull --rebase
            git push
          fi
