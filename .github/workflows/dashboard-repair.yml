name: Repair dashboard attention card
on:
  push:
    branches: [feature/brand-dashboards]
    paths: [pipeline/repair_attention_card.py, .github/workflows/dashboard-repair.yml]
permissions:
  contents: write
concurrency:
  group: dashboard-writes-${{ github.ref }}
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python pipeline/repair_attention_card.py
      - name: Commit repair
        run: |
          git config user.name 'Reduction monitor'
          git config user.email 'reduction-monitor@users.noreply.github.com'
          git add pipeline/signals_monitor.py public/dashboards/powerade/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Fix duplicated Wikipedia attention card'
            git pull --rebase
            git push
          fi
