name: YouTube monitoring
on:
  push:
    branches: [feature/brand-dashboards]
    paths: [pipeline/youtube_monitor.py, .github/workflows/youtube-monitoring.yml]
  workflow_dispatch:
  schedule:
    - cron: '41 11 * * 1'
permissions:
  contents: write
concurrency:
  group: youtube-monitoring-${{ github.ref }}
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect public campaign videos
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python pipeline/youtube_monitor.py
      - name: Commit video discovery
        run: |
          git config user.name 'Reduction monitor'
          git config user.email 'reduction-monitor@users.noreply.github.com'
          git add public/dashboards/data/powerade-youtube.json public/dashboards/powerade/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh Powerade YouTube discovery'
            git pull --rebase
            git push
          fi
